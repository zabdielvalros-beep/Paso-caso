<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PasoaCaso</title>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#151515;--text:#f5f5f5;--muted:#999;--line:#292929;--red:#e50914;--red2:#ff2631;--danger:#ff4545;--good:#eee;--shadow:0 10px 30px #0009}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{padding-bottom:86px}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh}.desktopAside{position:fixed;left:0;top:0;bottom:0;width:245px;background:#0d0d0d;border-right:1px solid var(--line);padding:25px 15px;z-index:30}.logo{font-size:23px;font-weight:900;margin:0 10px 28px;letter-spacing:-.8px}.logo span{color:var(--red)}nav button{width:100%;padding:12px 14px;margin:3px 0;background:transparent;color:#aaa;text-align:left;border-radius:10px}nav button.active,nav button:hover{background:#fff0;color:#fff;border-left:3px solid var(--red)}main{max-width:1450px;margin:0 auto;padding:24px 30px 50px}.desktopAside+main{margin-left:245px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.actions{display:flex;gap:8px}.primary{background:var(--red);color:#fff;padding:11px 16px;border-radius:10px;font-weight:800}.secondary{background:var(--panel);color:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px}.noticeLine{display:flex;align-items:center;gap:12px;padding:14px 15px;margin-bottom:14px;border:1px solid #3b1517;background:#110b0b;border-radius:13px}.noticeIcon{width:38px;height:38px;display:grid;place-items:center;background:var(--red);border-radius:10px;font-size:19px}.noticeText{flex:1}.noticeText b{display:block;margin-bottom:2px}.noticeLine button{background:var(--red);padding:8px 13px;border-radius:9px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,#151515,#101010);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.stat{min-height:115px;display:flex;justify-content:space-between;align-items:flex-start}.stat b{display:block;font-size:29px;margin-top:7px}.icon{width:38px;height:38px;border-radius:10px;background:#1d1d1d;display:grid;place-items:center;color:#fff;border:1px solid #333}.icon.red{color:#fff;background:#2a0c0e;border-color:#5b171b}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.card h2{font-size:17px;margin:0 0 14px}.progress{height:9px;background:#292929;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--red);border-radius:20px;transition:.3s}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #252525;min-width:0}.task:last-child{border-bottom:0}.check{appearance:none;width:20px;height:20px;border:2px solid #777;border-radius:50%;background:transparent;flex:none}.check:checked{border-color:var(--red);background:var(--red);box-shadow:inset 0 0 0 4px #111}.task .title{flex:1;min-width:0}.task .title b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.done{text-decoration:line-through;color:#777}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#222;color:#ddd;border:1px solid #333;white-space:nowrap}.badge.high{color:#fff;background:#3a0c0f;border-color:#6b161b}.badge.low{color:#bbb}.taskTools{display:flex;gap:5px;flex:none}.taskTools button{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:6px 8px}.taskTools .edit{color:#fff}.taskTools .delete{color:#ff6767}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{padding:13px;border:1px solid #2b2b2b;border-radius:12px;background:#121212}.mini b{font-size:24px}.chart{height:170px;display:flex;align-items:end;gap:8px;padding-top:8px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}.col .v{width:100%;max-width:34px;background:var(--red);border-radius:6px 6px 2px 2px;min-height:3px}.col small{color:#888;font-size:10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #282828}th{font-size:12px;color:#888}.selectSmall,.searchInput{padding:9px 10px;background:#111;color:#fff;border:1px solid #333;border-radius:9px}.searchInput{width:180px}.empty{padding:30px;text-align:center;color:#777}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:15px;z-index:100}.modal.show{display:grid}.dialog{background:#111;border:1px solid #333;border-radius:16px;padding:20px;max-width:520px;width:100%;box-shadow:0 20px 60px #000}.dialog h2{margin-top:0}.form{display:grid;gap:12px}.form label{font-weight:700;font-size:13px}.form input,.form select{width:100%;padding:11px;margin-top:5px;background:#090909;color:#fff;border:1px solid #333;border-radius:9px;outline:none}.form input:focus,.form select:focus,.searchInput:focus{border-color:var(--red)}.dialog .actions{justify-content:flex-end;margin-top:16px}.toast{position:fixed;right:18px;bottom:92px;background:#eee;color:#090909;padding:11px 14px;border-radius:10px;display:none;z-index:110;font-weight:700}.calendarHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.calendarHead .actions{gap:5px}.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calDow{text-align:center;color:#777;font-size:11px;padding:4px}.calDay{min-height:78px;border:1px solid #292929;border-radius:10px;background:#101010;padding:7px;cursor:pointer;overflow:hidden}.calDay:hover{border-color:#555}.calDay.mutedDay{opacity:.35}.calDay.selected{outline:2px solid var(--red);outline-offset:-2px}.calDay.todayDay .num{color:var(--red)}.calDay .num{font-weight:800;font-size:13px}.calDay .dot{display:block;color:#bbb;font-size:9px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calDay .dot::first-letter{color:var(--red)}.dayTasks{margin-top:14px;border-top:1px solid #292929;padding-top:12px}.calendarLegend{display:flex;gap:14px;color:#999;font-size:11px;margin-top:12px}.redDot{width:7px;height:7px;background:var(--red);display:inline-block;border-radius:50%;margin-right:4px}.bottomNav{display:none}
@media(max-width:900px){html,body{width:100%;max-width:100%;overflow-x:hidden}.desktopAside{display:none}.desktopAside+main{margin-left:0!important;width:100%;max-width:100%;}body{padding-bottom:82px;width:100%;max-width:100%;overflow-x:hidden}main{width:100%;margin:0!important;padding:15px 12px 24px;max-width:none}.top{display:block;margin-bottom:13px}.top h1{font-size:25px;letter-spacing:-.4px}.top .muted{font-size:12px;margin-top:3px}.top .actions{margin-top:12px;display:grid;grid-template-columns:1fr}.top .actions #clearDone{display:none}.primary{width:100%;padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px;border-radius:13px}.stat{min-height:95px}.stat b{font-size:24px}.stat .muted{font-size:11px}.icon{width:32px;height:32px;font-size:14px}.layout{display:block;margin-top:9px}.layout>.card{margin-top:9px}.noticeLine{padding:12px;gap:9px}.noticeIcon{width:35px;height:35px;flex:none}.noticeText{font-size:12px}.noticeLine button{font-size:12px;padding:8px 10px}.task{gap:8px;padding:11px 0}.task .title b{font-size:13px}.task .muted{font-size:11px}.badge{font-size:9px;padding:4px 6px}.taskTools button{padding:6px}.compare{gap:7px}.chart{height:150px;gap:4px}.calendarGrid{gap:3px}.calDay{min-height:57px;padding:5px;border-radius:8px}.calDay .dot{font-size:8px;margin-top:3px}.calDow{font-size:9px}.searchInput{width:100%}.taskHeader{display:grid!important;grid-template-columns:1fr;gap:8px!important}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.filters>*{width:100%}.calendarHead .actions button{padding:8px 10px}.bottomNav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:50;background:#0c0c0c;border-top:1px solid #282828;padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #000}.bottomNav button{background:transparent;color:#888;font-size:10px;padding:4px 2px}.bottomNav button.active{color:#fff}.bottomNav .navIcon{display:block;font-size:20px;line-height:22px}.bottomNav .plus{width:48px;height:48px;margin:-19px auto 0;border-radius:50%;background:var(--red);color:#fff;font-size:28px;box-shadow:0 0 0 5px #0c0c0c}.toast{right:12px;left:12px;bottom:92px;text-align:center}.dialog{max-height:92vh;overflow:auto;padding:17px}}
@media(max-width:420px){html,body,#content,.app,main{width:100%;max-width:100%;min-width:0}.desktopAside+main{margin-left:0!important}main{padding-left:10px;padding-right:10px}.grid{gap:7px}.card{padding:11px}.stat{min-height:90px}.stat b{font-size:22px}.noticeText{font-size:11px}.calDay{min-height:52px}.calendarLegend{gap:8px;font-size:10px}.taskTools button{font-size:12px}.bottomNav .navIcon{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<aside class="desktopAside"><div class="logo">Pasoa<span>Caso</span></div><nav id="sideNav">
<button class="active" data-view="dashboard">⌂ &nbsp; Resumen</button><button data-view="tasks">✓ &nbsp; Tareas</button><button data-view="calendar">□ &nbsp; Calendario</button><button data-view="reminders">◷ &nbsp; Recordatorios</button><button data-view="stats">▥ &nbsp; Comparativas</button>
</nav></aside>
<main>
<div class="top"><div><h1 id="heading">Resumen</h1><div class="muted" id="subheading">Planifica • Organiza • Avanza</div></div><div class="actions"><button class="secondary" id="clearDone">Limpiar completadas</button><button class="primary" id="addBtn">＋ Nueva tarea</button></div></div>
<section id="content"></section>
</main>
</div>
<nav class="bottomNav" id="bottomNav"><button data-view="dashboard" class="active"><span class="navIcon">⌂</span>Inicio</button><button data-view="calendar"><span class="navIcon">□</span>Calendario</button><button class="plus" id="mobileAdd">＋</button><button data-view="tasks"><span class="navIcon">✓</span>Tareas</button><button data-view="reminders"><span class="navIcon">◷</span>Alertas</button></nav>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Nueva tarea</h2><div class="form"><label>Título<input id="fTitle" placeholder="Ej. Terminar proyecto"></label><label>Fecha<input id="fDate" type="date"></label><label>Hora<input id="fTime" type="time"></label><label>Prioridad<select id="fPriority"><option>Normal</option><option>Alta</option><option>Baja</option></select></label><label>Categoría<select id="fCategory"><option>Personal</option><option>Trabajo</option><option>Estudio</option><option>Salud</option><option>Otro</option></select></label></div><div class="actions"><button class="secondary" id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='pasoacaso_v3';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
let view='dashboard',editId=null;
let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),calSelected=localDate();
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function datePlus(n){let d=new Date();d.setDate(d.getDate()+n);return localDate(d)}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(a,b){return b?Math.round(a/b*100):0}
function dateLabel(d){if(!d)return'Sin fecha';if(d===localDate())return'Hoy';if(d===datePlus(1))return'Mañana';if(d===datePlus(-1))return'Ayer';return new Date(d+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'})}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1900)}
function categoryClass(c){return c==='Trabajo'?'high':c==='Estudio'?'high':c==='Salud'?'low':''}
function taskHTML(t){return `<div class="task"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><div class="title ${t.done?'done':''}"><b>${esc(t.title)}</b><div class="muted">${dateLabel(t.date)} · ${t.time||'sin hora'}${t.category?' · '+esc(t.category):''}</div></div><span class="badge ${t.priority==='Alta'?'high':''}">${esc(t.priority||'Normal')}</span><div class="taskTools"><button class="edit" onclick="editTask(${t.id})" title="Editar">✎</button><button class="delete" onclick="removeTask(${t.id})" title="Eliminar">×</button></div></div>`}
function noticeHTML(){let secure=('https:'===location.protocol)||location.hostname==='localhost';let enabled=localStorage.getItem('pasoaCasoAlerts')==='1';let browser=('Notification' in window);let label=enabled?'Avisos activados':(secure&&browser?'Recibe avisos de tus tareas y horarios.':'Activa avisos dentro de PasoaCaso.');let button=enabled?'Activadas':'Activar';return `<div class="noticeLine"><div class="noticeIcon">♧</div><div class="noticeText"><b>Notificaciones</b><span class="muted" id="noticeStatus">${label}</span></div><button onclick="enableNotifications()">${button}</button></div>`}
function calendarTitle(){return calMonth.toLocaleDateString('es-MX',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
function calendarCells(){let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),out='';for(let i=0;i<42;i++){let n=i-start+1,dt,muted=false;if(n<1){dt=new Date(y,m-1,prev+n);muted=true}else if(n>last){dt=new Date(y,m+1,n-last);muted=true}else dt=new Date(y,m,n);let ds=localDate(dt),arr=tasks.filter(t=>t.date===ds&&!t.done);out+=`<div class="calDay ${muted?'mutedDay':''} ${ds===calSelected?'selected':''} ${ds===localDate()?'todayDay':''}" onclick="selectDate('${ds}')"><div class="num">${dt.getDate()}</div>${arr.slice(0,2).map(t=>`<span class="dot">● ${esc(t.title)}</span>`).join('')}${arr.length>2?`<span class="dot">+${arr.length-2} más</span>`:''}</div>`}return out}
function calendarHTML(){let selected=tasks.filter(t=>t.date===calSelected).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));return `<div class="card"><div class="calendarHead"><div><h2 style="margin-bottom:3px">${calendarTitle()}</h2><span class="muted">Selecciona un día</span></div><div class="actions"><button class="secondary" onclick="changeMonth(-1)">‹</button><button class="secondary" onclick="goToday()">Hoy</button><button class="secondary" onclick="changeMonth(1)">›</button></div></div><div class="calendarGrid">${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>`<div class="calDow">${x}</div>`).join('')}${calendarCells()}</div><div class="calendarLegend"><span><i class="redDot"></i> Tareas pendientes</span><span>Fecha seleccionada: <b>${dateLabel(calSelected)}</b></span></div><div class="dayTasks"><h2>Tareas del día</h2>${selected.length?selected.map(taskHTML).join(''):'<div class="empty">No hay tareas para este día.</div>'}</div></div>`}
function changeMonth(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);render()}
function goToday(){let d=new Date();calMonth=new Date(d.getFullYear(),d.getMonth(),1);calSelected=localDate();render()}
function selectDate(ds){calSelected=ds;let d=new Date(ds+'T12:00:00');calMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}
function taskListHTML(arr){return arr.length?arr.map(taskHTML).join(''):'<div class="empty">No hay tareas.</div>'}
function dashboard(){let total=tasks.length,done=tasks.filter(t=>t.done).length,today=tasks.filter(t=>t.date===localDate()),td=today.filter(t=>t.done).length;return `${noticeHTML()}<div class="grid"><div class="card stat"><div><div class="muted">Total de tareas</div><b>${total}</b></div><div class="icon">✓</div></div><div class="card stat"><div><div class="muted">Completadas</div><b>${done}</b><span class="muted">${pct(done,total)}%</span></div><div class="icon">✓</div></div><div class="card stat"><div><div class="muted">Pendientes</div><b>${total-done}</b><span class="muted">${pct(total-done,total)}%</span></div><div class="icon red">!</div></div><div class="card stat"><div><div class="muted">Hoy</div><b>${today.length}</b><span class="muted">${td} hechas</span></div><div class="icon">◷</div></div></div><div class="layout"><div class="card"><div class="row"><h2>Progreso general</h2><b>${pct(done,total)}%</b></div><div class="progress"><div class="bar" style="width:${pct(done,total)}%"></div></div><div class="compare" style="margin-top:13px"><div class="mini"><div class="muted">Completadas</div><b>${done}</b></div><div class="mini"><div class="muted">Pendientes</div><b>${total-done}</b></div></div></div><div class="card"><div class="row"><h2>Tareas de hoy</h2><b>${today.length}</b></div>${taskListHTML(today)}</div></div><div class="layout"><div>${calendarHTML()}</div><div class="card"><h2>Resumen rápido</h2><div class="compare"><div class="mini"><div class="muted">Hoy</div><b>${pct(td,today.length)}%</b></div><div class="mini"><div class="muted">Avance</div><b>${pct(done,total)}%</b></div></div><p class="muted">Completa tus tareas y usa el calendario para organizar tus horarios.</p></div></div>`}
function tasksView(){let arr=[...tasks];return `<div class="card"><div class="row taskHeader"><h2>Todas las tareas (${tasks.length})</h2><div class="filters"><input class="searchInput" id="search" placeholder="Buscar tarea…"><select class="selectSmall" id="filter"><option value="all">Todas</option><option value="open">Pendientes</option><option value="done">Completadas</option></select><select class="selectSmall" id="sort"><option value="date">Fecha</option><option value="priority">Prioridad</option><option value="title">Nombre</option></select></div></div><div id="taskList">${taskListHTML(arr)}</div></div>`}
function remindersView(){let arr=[...tasks].filter(t=>!t.done&&t.time).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="card">${noticeHTML()}<h2>Próximos recordatorios</h2>${arr.length?arr.map(taskHTML).join(''):'<div class="empty">No hay recordatorios con horario.</div>'}</div>`}
function statsView(){let done=tasks.filter(t=>t.done).length,total=tasks.length,days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=localDate(d),n=tasks.filter(t=>t.date===ds&&t.done).length;days.push({d,n})}let max=Math.max(1,...days.map(x=>x.n));return `<div class="layout"><div class="card"><h2>Completadas por día</h2><div class="chart">${days.map(x=>`<div class="col"><div class="v" style="height:${Math.max(3,x.n/max*125)}px"></div><b>${x.n}</b><small>${x.d.toLocaleDateString('es-MX',{weekday:'short'}).slice(0,3)}</small></div>`).join('')}</div></div><div class="card"><h2>Tu rendimiento</h2><div class="compare"><div class="mini"><div class="muted">Eficiencia</div><b>${pct(done,total)}%</b></div><div class="mini"><div class="muted">Pendientes</div><b>${total-done}</b></div></div><p class="muted">${done?'Has completado '+done+' tarea'+(done===1?'':'s')+'.':'Completa tareas para generar comparativas.'}</p></div></div><div class="card" style="margin-top:14px"><h2>Comparativa de estados</h2><table><tr><th>Estado</th><th>Cantidad</th><th>Porcentaje</th></tr><tr><td>Completadas</td><td>${done}</td><td>${pct(done,total)}%</td></tr><tr><td>Pendientes</td><td>${total-done}</td><td>${pct(total-done,total)}%</td></tr></table></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let titles={dashboard:'Resumen',tasks:'Tareas',calendar:'Calendario',reminders:'Recordatorios',stats:'Comparativas'},subs={dashboard:'Planifica • Organiza • Avanza',tasks:'Ordena, edita y completa tus pendientes.',calendar:'Organiza tus tareas por día y horario.',reminders:'Tus avisos y tareas programadas.',stats:'Compara tu rendimiento y tu avance.'};document.getElementById('heading').textContent=titles[view];document.getElementById('subheading').textContent=subs[view];document.getElementById('content').innerHTML=view==='dashboard'?dashboard():view==='tasks'?tasksView():view==='calendar'?calendarHTML():view==='reminders'?remindersView():statsView();if(view==='tasks')bindTaskFilters()}
function bindTaskFilters(){let apply=()=>{let q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value,s=document.getElementById('sort').value,a=tasks.filter(t=>(!q||t.title.toLowerCase().includes(q))&&(f==='all'||(f==='done'&&t.done)||(f==='open'&&!t.done)));if(s==='title')a.sort((x,y)=>x.title.localeCompare(y.title));else if(s==='priority'){let p={Alta:0,Normal:1,Baja:2};a.sort((x,y)=>(p[x.priority]??1)-(p[y.priority]??1))}else a.sort((x,y)=>(x.date+(x.time||'99:99')).localeCompare(y.date+(y.time||'99:99')));document.getElementById('taskList').innerHTML=taskListHTML(a)};['search','filter','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',apply))}
function toggleTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;save();render();toast(t.done?'Tarea completada':'Tarea pendiente')}
function removeTask(id){let t=tasks.find(x=>x.id===id);tasks=tasks.filter(x=>x.id!==id);save();render();toast(t?'Tarea eliminada':'')}
function openEditor(id=null){editId=id;let t=id?tasks.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=t?'Editar tarea':'Nueva tarea';document.getElementById('fTitle').value=t?.title||'';document.getElementById('fDate').value=t?.date||calSelected||localDate();document.getElementById('fTime').value=t?.time||'';document.getElementById('fPriority').value=t?.priority||'Normal';document.getElementById('fCategory').value=t?.category||'Personal';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('fTitle').focus(),50)}
function editTask(id){openEditor(id)}
async function enableNotifications(){
  localStorage.setItem('pasoaCasoAlerts','1');
  let secure=('https:'===location.protocol)||location.hostname==='localhost';
  if('Notification' in window && secure){
    try{
      if(Notification.permission==='default') await Notification.requestPermission();
      if(Notification.permission==='granted') toast('Notificaciones del sistema activadas');
      else if(Notification.permission==='denied') toast('Avisos de la app activados. El navegador bloqueó las notificaciones del sistema.');
      else toast('Avisos de la app activados');
    }catch(e){toast('Avisos de la app activados')}
  }else{
    toast('Avisos de la app activados. Para notificaciones del sistema usa HTTPS.');
  }
  render();
}
function showInAppReminder(t){
  toast('⏰ Es hora de: '+t.title);
  if(navigator.vibrate) try{navigator.vibrate([180,100,180])}catch(e){}
}
function checkNotifications(){
  let now=new Date(),ds=localDate(now),hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if(localStorage.getItem('pasoaCasoAlerts')!=='1') return;
  tasks.filter(t=>!t.done&&t.date===ds&&t.time===hm&&!t.notifiedAt).forEach(t=>{
    let sent=false;
    if('Notification' in window && Notification.permission==='granted'){
      try{new Notification('PasoaCaso',{body:'Es hora de: '+t.title,tag:'pasoacaso-'+t.id});sent=true}catch(e){}
    }
    if(!sent) showInAppReminder(t);
    t.notifiedAt=ds+' '+hm;save();
  });
}
function changeView(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.desktopAside [data-view],.bottomNav [data-view]').forEach(b=>b.addEventListener('click',()=>changeView(b.dataset.view)));
document.getElementById('addBtn').onclick=()=>openEditor();document.getElementById('mobileAdd').onclick=()=>openEditor();document.getElementById('cancel').onclick=()=>{editId=null;document.getElementById('modal').classList.remove('show')};document.getElementById('save').onclick=()=>{let title=document.getElementById('fTitle').value.trim();if(!title){toast('Escribe un título');return}let data={title,date:document.getElementById('fDate').value||localDate(),time:document.getElementById('fTime').value,priority:document.getElementById('fPriority').value,category:document.getElementById('fCategory').value};if(editId){let t=tasks.find(x=>x.id===editId);Object.assign(t,data);toast('Tarea actualizada')}else{tasks.push({id:Date.now(),...data,done:false,notifiedAt:''});toast('Tarea creada')}save();editId=null;document.getElementById('modal').classList.remove('show');render()};document.getElementById('clearDone').onclick=()=>{let n=tasks.filter(t=>t.done).length;if(!n){toast('No hay tareas completadas');return}tasks=tasks.filter(t=>!t.done);save();render();toast(`${n} completada${n===1?'':'s'} eliminada${n===1?'':'s'}`)};
render();setInterval(checkNotifications,15000);checkNotifications();
</script>
